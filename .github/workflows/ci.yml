name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TELEMETRY_ENDPOINT: https://recording-extension-telemetry.kstroevsky.workers.dev/api/telemetry/batches
      FULL_VALIDATION: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:e2e

      - name: Select draft Jest scope
        if: env.FULL_VALIDATION != 'true'
        id: jest-scope
        shell: bash
        run: |
          git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" > "$RUNNER_TEMP/changed-files.txt"
          if grep -Eq '^(package(-lock)?\.json|jest\.config\.js|tests/setup\.ts|tsconfig[^/]*\.json|webpack\.config\.js)$' "$RUNNER_TEMP/changed-files.txt"; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run full Jest suite
        if: env.FULL_VALIDATION == 'true' || steps.jest-scope.outputs.full == 'true'
        run: npm run test:unit:jest

      - name: Run affected Jest tests
        if: env.FULL_VALIDATION != 'true' && steps.jest-scope.outputs.full != 'true'
        run: npm run test:unit:jest -- --changedSince="origin/${GITHUB_BASE_REF}" --passWithNoTests

      - name: Run Node tests
        run: npm run test:unit:node

      - name: Run draft architecture guard
        if: env.FULL_VALIDATION != 'true'
        run: npm run check:background-architecture

      - name: Build production extension
        if: env.FULL_VALIDATION == 'true'
        run: npm run build

      - name: Run production guards
        if: env.FULL_VALIDATION == 'true'
        run: npm run test:production-guards

  mock-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TELEMETRY_ENDPOINT: https://recording-extension-telemetry.kstroevsky.workers.dev/api/telemetry/batches
      FULL_VALIDATION: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps chromium
      - run: npm run build:e2e:mock

      - name: Run affected draft mock E2E tests
        if: env.FULL_VALIDATION != 'true'
        run: >-
          npx playwright test --config=playwright.config.ts
          --only-changed="origin/${GITHUB_BASE_REF}"
          --pass-with-no-tests
          --grep-invert "@production-build|@smoke|@perf-(full|endurance|hardware|contention)|@analysis-bench|@sharing-e2e"

      - name: Run mandatory mock E2E smoke tests
        run: npx playwright test --config=playwright.config.ts --grep "@smoke"

      - name: Run remaining full mock E2E suite
        if: env.FULL_VALIDATION == 'true'
        run: >-
          npx playwright test --config=playwright.config.ts
          --grep-invert "@production-build|@smoke|@perf-(full|endurance|hardware|contention)|@analysis-bench|@sharing-e2e"

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/playwright/html-report/
            output/playwright/test-results/
          if-no-files-found: ignore
          retention-days: 14

  sharing:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FULL_VALIDATION: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
      SHARING_SERVICE_ORIGIN: https://127.0.0.1:8791
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select sharing validation scope
        id: sharing-scope
        shell: bash
        run: |
          if [[ "$FULL_VALIDATION" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" > "$RUNNER_TEMP/sharing-changed-files.txt"
          if grep -Eq '^(sharing-worker/|src/sharing/|src/shared/sharing|src/background/sharing/|src/offscreen/|src/recordings(\.ts|/)|static/(recordings\.html|styles/recordings\.css)|tests/e2e/sharing-lifecycle\.spec\.ts|tests/e2e/helpers/(sharingWorker|extensionHarness|driveSimulator)\.ts|package(-lock)?\.json|webpack\.config\.js|tsconfig[^/]*\.json)' "$RUNNER_TEMP/sharing-changed-files.txt"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.sharing-scope.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install extension dependencies
        if: steps.sharing-scope.outputs.run == 'true'
        run: npm ci

      - name: Install sharing Worker dependencies
        if: steps.sharing-scope.outputs.run == 'true'
        run: npm ci --prefix sharing-worker

      - name: Typecheck sharing Worker and viewer
        if: steps.sharing-scope.outputs.run == 'true'
        run: npm --prefix sharing-worker run typecheck

      - name: Run sharing Worker tests
        if: steps.sharing-scope.outputs.run == 'true'
        run: npm --prefix sharing-worker test

      - name: Verify generated viewer is committed
        if: steps.sharing-scope.outputs.run == 'true'
        run: git diff --exit-code -- sharing-worker/src/viewer/app.generated.ts

      - name: Dry-run sharing Worker deployment
        if: steps.sharing-scope.outputs.run == 'true'
        run: npm --prefix sharing-worker run dry-run

      - name: Install Chromium
        if: steps.sharing-scope.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Build sharing E2E extension
        if: steps.sharing-scope.outputs.run == 'true'
        run: npm run build:e2e:mock

      - name: Run sharing lifecycle E2E
        if: steps.sharing-scope.outputs.run == 'true'
        run: npx playwright test tests/e2e/sharing-lifecycle.spec.ts --config=playwright.config.ts

      - name: Upload sharing Playwright diagnostics
        if: ${{ !cancelled() && steps.sharing-scope.outputs.run == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sharing-playwright-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/playwright/html-report/
            output/playwright/test-results/
          if-no-files-found: ignore
          retention-days: 14

  production-e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TELEMETRY_ENDPOINT: https://recording-extension-telemetry.kstroevsky.workers.dev/api/telemetry/batches
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify full git history for production versioning
        run: test "$(git rev-parse --is-shallow-repository)" = "false"
      - run: npm run build
      - name: Run production integration E2E
        env:
          EXTENSION_PATH: dist
        run: npx playwright test --config=playwright.config.ts --grep "@production-build"

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-playwright-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/playwright/html-report/
            output/playwright/test-results/
          if-no-files-found: ignore
          retention-days: 14
